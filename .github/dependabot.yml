version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/table-core"
        update-types: ["version-update:semver-major"]
      # 2.x needs node:module's findPackageJSON, which Bun does not have yet.
      - dependency-name: "@vite-pwa/sveltekit"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    # SKIE hard-fails the build on any Kotlin version it hasn't whitelisted.
    # Bump Kotlin by hand together with SKIE.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
