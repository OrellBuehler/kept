name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Private terms come from a repository secret and are never printed.
      - name: Leak guard
        env:
          KEPT_PRIVATE_TERMS: ${{ secrets.KEPT_PRIVATE_TERMS }}
        run: bun run leak-guard --all

      - name: Format check (prettier)
        run: bun run format:check

      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (svelte-check)
        run: bun run check

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            bun -e '
              const t = JSON.parse(await Bun.file("coverage/coverage-summary.json").text()).total;
              const rows = ["lines", "statements", "functions", "branches"].map(
                (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`
              );
              console.log(["## Unit test coverage", "", "| metric | covered | count |", "| --- | --- | --- |", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: bun run build
