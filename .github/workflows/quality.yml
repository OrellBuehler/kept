name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Private terms come from a repository secret and are never printed.
      - name: Leak guard
        env:
          KEPT_PRIVATE_TERMS: ${{ secrets.KEPT_PRIVATE_TERMS }}
        run: bun run leak-guard --all

      - name: Format check (prettier)
        run: bun run format:check

      - name: Lint (eslint)
        run: bun run lint

      - name: Typecheck (svelte-check)
        run: bun run check

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            bun -e '
              const t = JSON.parse(await Bun.file("coverage/coverage-summary.json").text()).total;
              const rows = ["lines", "statements", "functions", "branches"].map(
                (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`
              );
              console.log(["## Unit test coverage", "", "| metric | covered | count |", "| --- | --- | --- |", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: bun run build

  s3-storage:
    name: S3 blob storage contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A throwaway S3-compatible server (SeaweedFS, path-style like MinIO and Garage).
      S3_IMAGE: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
      KEPT_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      KEPT_TEST_S3_BUCKET: kept-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Random per run, so no credential is committed.
      - name: Generate S3 credentials
        run: |
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          {
            echo "KEPT_TEST_S3_ACCESS_KEY_ID=kept$(openssl rand -hex 4)"
            echo "KEPT_TEST_S3_SECRET_ACCESS_KEY=$secret"
          } >> "$GITHUB_ENV"

      - name: Start S3 server
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID="$KEPT_TEST_S3_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$KEPT_TEST_S3_SECRET_ACCESS_KEY" \
            "$S3_IMAGE" server -s3 -dir=/data
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "$KEPT_TEST_S3_ENDPOINT"; then exit 0; fi
            sleep 1
          done
          docker logs s3
          echo "S3 server did not become ready" >&2
          exit 1

      - name: Create bucket
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          AWS_ACCESS_KEY_ID="$KEPT_TEST_S3_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$KEPT_TEST_S3_SECRET_ACCESS_KEY" \
            aws --endpoint-url "$KEPT_TEST_S3_ENDPOINT" s3 mb "s3://$KEPT_TEST_S3_BUCKET"

      - name: S3 storage tests
        run: bun run test src/lib/server/storage/s3.test.ts --reporter=verbose

      - name: Server log on failure
        if: ${{ failure() }}
        run: docker logs s3 | tail -n 50
