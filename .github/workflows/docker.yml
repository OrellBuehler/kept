name: Docker

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  PG_IMAGE: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

jobs:
  # A release tag can point at a commit whose checks were skipped or red, so the
  # published image is gated on the full quality workflow (SQLite and PostgreSQL
  # suites, S3 contract tests, schema drift check, build), not just a subset.
  quality:
    name: Quality gate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    secrets:
      KEPT_PRIVATE_TERMS: ${{ secrets.KEPT_PRIVATE_TERMS }}

  image:
    name: Build image
    needs: [quality]
    if: ${{ !cancelled() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image name lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp || github.event.release.created_at || github.event.pull_request.updated_at }}

      - name: Smoke test
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name kept-smoke -p 3000:3000 \
            -e KEPT_SECRET_KEY="$(openssl rand -base64 32)" "$image"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo; echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs kept-smoke
          exit 1

      # The same image against PostgreSQL: start-up runs the migrations, and /setup
      # reads the user table, so a broken PostgreSQL path in the built bundle fails here.
      - name: Smoke test (PostgreSQL)
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          docker network create kept-smoke-net
          docker run -d --name kept-smoke-pg --network kept-smoke-net \
            -e POSTGRES_USER=kept -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=kept \
            "$PG_IMAGE"
          for i in $(seq 1 60); do
            if docker exec kept-smoke-pg pg_isready -U kept -d kept -h 127.0.0.1 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker run -d --name kept-smoke-app --network kept-smoke-net -p 3001:3000 \
            -e KEPT_SECRET_KEY="$(openssl rand -base64 32)" \
            -e KEPT_STORAGE_DIR=/data/storage \
            -e DATABASE_URL="postgres://kept:$password@kept-smoke-pg:5432/kept" "$image"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health \
              && curl -fsS -o /dev/null http://127.0.0.1:3001/setup; then
              echo; echo "healthy on PostgreSQL after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs kept-smoke-app
          docker logs kept-smoke-pg | tail -n 30
          exit 1

      # For each release under src/lib/testing/fixtures/upgrade/: builds a database with that
      # published image, seeds it with synthetic data, starts this image on the same volume and
      # checks that the migrations lost and corrupted nothing (see scripts/upgrade/run.ts).
      # A later release is one more directory there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Upgrade test
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          bun scripts/upgrade/run.ts --image "$image"

  # Only this job can write packages, and it never runs for pull requests.
  publish:
    name: Publish image
    needs: [image]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image name lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.release.created_at }}
