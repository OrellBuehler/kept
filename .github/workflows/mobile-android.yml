name: Mobile Android

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/lib/testing/fixtures/app-contract/**"
      - ".github/workflows/mobile-android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/lib/testing/fixtures/app-contract/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The legacy 'tools' package the action installs by default was removed
        # from the SDK repository (android-actions/setup-android#537), so the
        # default 'tools platform-tools' list makes sdkmanager exit 1.
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Run ktlint
        run: ./gradlew shared:ktlintCheck androidApp:ktlintCheck

      - name: Build shared module
        run: ./gradlew shared:compileDebugKotlinAndroid

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The legacy 'tools' package the action installs by default was removed
        # from the SDK repository (android-actions/setup-android#537), so the
        # default 'tools platform-tools' list makes sdkmanager exit 1.
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Run Android lint
        run: ./gradlew androidApp:lintDebug

      - name: Run shared module tests
        run: ./gradlew shared:allTests

      - name: Run Android unit tests
        run: ./gradlew androidApp:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            mobile/androidApp/build/reports/tests/
            mobile/shared/build/reports/tests/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      # Informational only: no coverage threshold fails the build. The task runs each
      # module's JVM unit tests with the Kover agent attached.
      - name: Generate Kover coverage reports
        run: ./gradlew shared:koverXmlReportDebug shared:koverHtmlReportDebug androidApp:koverXmlReportDebug

      - name: Summarize coverage
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          reports = {
              "shared": "shared/build/reports/kover/reportDebug.xml",
              "androidApp": "androidApp/build/reports/kover/reportDebug.xml",
          }
          rows = ["## Kotlin coverage (Kover)", "", "| Module | Lines | Branches | Methods |", "| --- | --- | --- | --- |"]
          for module, path in reports.items():
              if not os.path.exists(path):
                  rows.append(f"| {module} | no report | | |")
                  continue
              counters = {c.get("type"): c for c in ET.parse(path).getroot().findall("counter")}

              def pct(kind):
                  c = counters.get(kind)
                  if c is None:
                      return "n/a"
                  missed, covered = int(c.get("missed")), int(c.get("covered"))
                  total = missed + covered
                  return f"{100 * covered / total:.1f}% ({covered}/{total})" if total else "n/a"

              rows.append(f"| {module} | {pct('LINE')} | {pct('BRANCH')} | {pct('METHOD')} |")
          text = "\n".join(rows)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text + "\n")
          PY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-coverage
          path: |
            mobile/shared/build/reports/kover/
            mobile/androidApp/build/reports/kover/
          retention-days: 14

  # Always-reporting required check: a failed or cancelled job fails the gate.
  mobile-android-gate:
    if: always()
    permissions: {}
    needs: [build, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Android jobs to have passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            exit 1
          fi
